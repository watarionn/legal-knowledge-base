schema_version: '1.1'
contract: legal-kb-phase4-xml-ingestion
status: implemented-full-import-validated
source_of_truth:
- docs/architecture/system-architecture.md
- docs/architecture/roadmap.md
- docs/validation/xsd-validation.md
- docs/validation/phase3_full_bootstrap_result.public.json

scope:
  phase: 4
  phase_name: XML構造DB
  input_snapshot:
    manifest: ../../docs/validation/xml_snapshot_manifest.public.json
    expected_xml_count: 10711
    expected_unique_revision_id_count: 10711
  target_schema: legal_kb
  primary_entities: [law_document, provision_node, attachment]
  support_entities: [source_file_member, xml_parse_issue, reconciliation_issue]

identity:
  document_id:
    algorithm: sha256
    input: law_revision_id + U+001F + lower(source_xml_sha256)
    external_format: lowercase-hex-64
  node_id:
    algorithm: sha256
    input: document_id + U+001F + node_kind + U+001F + xml_path
    external_format: lowercase-hex-64
    postgres_storage: bytea-32
  attachment_id:
    algorithm: sha256
    input: document_id + U+001F + ref_node_id + U+001F + source_attribute_name + U+001F + source_src
    external_format: lowercase-hex-64

raw_provenance:
  rules:
  - ZIP4本はimmutable source_fileとして登録する。
  - ZIP内部XMLも個別source_fileとして登録し、source_file_memberでcontainerとmember_pathを結ぶ。
  - member_path、CRC32、圧縮/非圧縮サイズを原値保存する。
  - 個別XMLのSHA-256は展開後RAWバイトから計算する。
  - normalized DB値でRAW XMLを置換しない。
  - 大容量ZIP・XML本文・DB dumpをGitへコミットしない。

revision_binding:
  filename_rule: '^[0-9A-Z]{15}_[0-9]{8}_[0-9A-Z]{15}\.xml$'
  rules:
  - filenameからlaw_revision_id候補を取得する。
  - 既存Phase 3 law_revisionへだけ結合する。
  - XMLからlaw_revisionをseedしない。
  - Phase 3に存在しないrevisionはRAW source_file/source_file_memberを保持し、LAW_REVISION_NOT_RECONCILEDをreconciliation_issueへ記録する。
  - 未照合revisionにはlaw_document/provision_nodeを作らない。
  - filenameの日付だけを法的効力判定に使用しない。
  observed_full_snapshot_2026_09_05:
    reconciled: 10705
    deferred_unreconciled: 6
    normal_failures: 0

xml_parser:
  parser_version: phase4-xml-parser-0.1
  capabilities:
  - namespace-tolerant
  - mixed-content-aware
  - tail-text-preserving
  - unknown-element-and-attribute-preserving
  - document-order-preserving
  - comments-and-processing-instructions-tolerant
  memory_model:
    rule: one XML document is materialized at a time; the whole corpus is never materialized together
    measured_max_nodes_per_document: 201013
  well_formedness:
    failure_behavior: persist RAW, create issue, create no normalized nodes
  xsd_validation:
    reference: XMLSchemaForJapaneseLaw_v3.xsd
    gate_ingestion: false
    statuses: [not-checked, valid, invalid, error]
    rule: XSD invalid official XML is never rejected or auto-fixed solely for schema invalidity
    full_import_note: per-document XSD status was not reloaded into the relational run; the independently pinned snapshot baseline remains 9932 valid / 779 invalid

compact_node_storage:
  rationale: 32,189,514-node corpus made repeated 64-char document/node hashes and full xml_path in composite indexes operationally excessive
  physical_key: [document_pk, document_order]
  parent_reference: [document_pk, parent_document_order]
  logical_node_id:
    retained: true
    postgres_type: bytea
    bytes: 32
  ordering:
    ordinal: 1-based position among all direct children
    document_order: 1-based depth-first order within document
    path_index: 1-based position among same expanded-name/node-kind siblings
  xml_path:
    stored_per_row: false
    reconstructable: true
    function: legal_kb.provision_node_xml_path(document_pk, document_order)
    element_segment: '{expanded-name}[path_index]'
    comment_segment: comment()[path_index]
    processing_instruction_segment: processing-instruction()[path_index]
    invariant: reconstructed path plus document_id reproduces the parser node_id contract

node_model:
  coverage: every XML element; Article is never assumed universal
  node_kinds: [element, comment, processing-instruction]
  attributes:
    authoritative_normalized_observation: attributes_jsonb
    projections: [structural_num, old_num, old_style]
  numbering:
    structural_num: machine structural number such as Num
    display_label: rendered title/label observation
    rule: never overwrite one with the other

mixed_content:
  authoritative_order_source: mixed_content_jsonb plus recursive child nodes and immutable RAW
  text_original:
    role: optional denormalized string-value cache for text-bearing nodes
    rule: structural containers may store null to avoid recursively duplicating descendant text
  segments:
  - kind: text
    fields: [value]
  - kind: child
    fields: [document_order]
  - kind: tail
    fields: [after_document_order, value]
  rules:
  - preserve whitespace/punctuation exactly as parsed
  - never trim or Unicode-normalize Phase 4 source text
  - child/tail references are document-local
  search_text:
    field: text_search_normalized
    phase4_behavior: null
    authoritative: false

attachments:
  discovery: any attribute whose local name is src
  source_src:
    authoritative: true
    exact_source_value: true
    empty_string_allowed: true
    note: the official snapshot contains src="" observations; they are retained instead of invented or dropped
  resolution:
    separate_from_source: true
    statuses: [unresolved, resolved, missing, fetch-failed, external]
    rule: resolved_locator never overwrites source_src

transactionality:
  unit: one reconciled XML document
  bulk_method: PostgreSQL COPY FROM STDIN
  rules:
  - law_document and its node/attachment/parse-issue rows commit atomically per document
  - successful documents remain committed if another document fails
  - identical reruns skip an existing deterministic document_id
  - full runner may resume by preloading already imported revision IDs before opening XML members

