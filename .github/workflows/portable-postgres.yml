name: Portable PostgreSQL Artifact

on:
  pull_request:
    paths:
      - .github/workflows/portable-postgres.yml

permissions:
  contents: read

jobs:
  package-postgres:
    runs-on: ubuntu-latest
    steps:
      - name: Export PostgreSQL 16 container rootfs
        run: |
          set -euo pipefail
          docker pull postgres:16
          cid="$(docker create postgres:16)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker export "$cid" | gzip -1 > postgres16-rootfs.tar.gz
          sha256sum postgres16-rootfs.tar.gz > postgres16-rootfs.sha256
          ls -lh postgres16-rootfs.tar.gz

      - name: Recheck six snapshot/API revision exceptions
        shell: python
        run: |
          import urllib.request

          checks = {
              "211AC0000000070": ["211AC0000000070_20270518_505AC0000000031"],
              "314AC0000000073": ["314AC0000000073_20270518_505AC0000000031"],
              "342AC0000000035": [
                  "342AC0000000035_21171231_507AC0000000013",
                  "342AC0000000035_21171231_507AC0000000032",
              ],
              "342AC0000000081": ["342AC0000000081_20270518_505AC0000000031"],
              "411AC0000000097": ["411AC0000000097_20270620_506AC0000000060"],
          }
          for law_id, targets in checks.items():
              url = f"https://laws.e-gov.go.jp/api/2/law_revisions/{law_id}"
              with urllib.request.urlopen(url, timeout=60) as response:
                  body = response.read().decode("utf-8")
              for target in targets:
                  print(f"{target}\tpresent={str(target in body).lower()}\tresponse_bytes={len(body)}")

      - name: Upload portable PostgreSQL artifact
        uses: actions/upload-artifact@v4
        with:
          name: portable-postgres16-rootfs
          path: |
            postgres16-rootfs.tar.gz
            postgres16-rootfs.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
