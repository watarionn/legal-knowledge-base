name: PostgreSQL Smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legal_kb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d legal_kb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/legal_kb

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.5"

      - name: Install psycopg
        run: python -m pip install --disable-pip-version-check --no-input "psycopg[binary]>=3,<4"

      - name: Show PostgreSQL version
        run: psql "$DATABASE_URL" -Atc "select version();"

      - name: Apply Phase 3, Phase 4, and Phase 5 DDL
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f implementation/phase3/001_law_history_schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f implementation/phase4/001_xml_structure_schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f implementation/phase5/001_temporal_resolution_schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f implementation/phase5/006_lexical_structural_search_schema.sql

      - name: Run real XML PostgreSQL COPY smoke
        run: |
          python implementation/phase4/013_copy_import_smoke.py \
            --result "$RUNNER_TEMP/phase4-postgres-copy-smoke.json"
          cat "$RUNNER_TEMP/phase4-postgres-copy-smoke.json"

      - name: Run Phase 5.1 temporal resolution smoke
        run: python implementation/phase5/005_temporal_resolution_smoke.py

      - name: Run Phase 5.2 lexical and structural search smoke
        run: python implementation/phase5/007_lexical_structural_search_smoke.py
