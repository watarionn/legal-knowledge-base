name: PostgreSQL Smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legal_kb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d legal_kb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/legal_kb

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.5"

      - name: Install psycopg
        run: python -m pip install --disable-pip-version-check --no-input "psycopg[binary]>=3,<4"

      - name: Show PostgreSQL version
        run: psql "$DATABASE_URL" -Atc "select version();"

      - name: Apply Phase 3 and Phase 4 DDL
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f implementation/phase3/001_law_history_schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f implementation/phase4/001_xml_structure_schema.sql

      - name: Run real XML PostgreSQL COPY smoke
        run: |
          python implementation/phase4/013_copy_import_smoke.py \
            --result "$RUNNER_TEMP/phase4-postgres-copy-smoke.json"
          cat "$RUNNER_TEMP/phase4-postgres-copy-smoke.json"

      - name: Export temporary local execution kit
        run: |
          set -euo pipefail
          cid="$(docker create postgres:16)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          docker export "$cid" | gzip -1 > "$RUNNER_TEMP/postgres16-rootfs.tar.gz"
          sha256sum "$RUNNER_TEMP/postgres16-rootfs.tar.gz" > "$RUNNER_TEMP/postgres16-rootfs.sha256"
          python -m pip install --disable-pip-version-check --no-input \
            --target "$RUNNER_TEMP/psycopg-portable" "psycopg[binary]>=3,<4"
          tar -C "$RUNNER_TEMP" -czf "$RUNNER_TEMP/psycopg-portable.tar.gz" psycopg-portable
          sha256sum "$RUNNER_TEMP/psycopg-portable.tar.gz" > "$RUNNER_TEMP/psycopg-portable.sha256"
          ls -lh "$RUNNER_TEMP/postgres16-rootfs.tar.gz" "$RUNNER_TEMP/psycopg-portable.tar.gz"

      - name: Upload temporary local execution kit
        uses: actions/upload-artifact@v4
        with:
          name: phase4-local-postgres-kit
          path: |
            ${{ runner.temp }}/postgres16-rootfs.tar.gz
            ${{ runner.temp }}/postgres16-rootfs.sha256
            ${{ runner.temp }}/psycopg-portable.tar.gz
            ${{ runner.temp }}/psycopg-portable.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
