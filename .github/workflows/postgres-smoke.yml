name: PostgreSQL Smoke

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  postgres-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: legal_kb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d legal_kb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/legal_kb

    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.13.5"

      - name: Install psycopg
        run: python -m pip install --disable-pip-version-check --no-input "psycopg[binary]>=3,<4"

      - name: Show PostgreSQL version
        run: psql "$DATABASE_URL" -Atc "select version();"

      - name: Apply Phase 3 and Phase 4 DDL
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f implementation/phase3/001_law_history_schema.sql
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f implementation/phase4/001_xml_structure_schema.sql

      - name: Diagnose SHA-256 constraint
        run: |
          psql "$DATABASE_URL" -Atc "SELECT length('97963a154c9e22c371028acf48cd8b5721bb37c56648c36f41d25141f16d3a8e'), '97963a154c9e22c371028acf48cd8b5721bb37c56648c36f41d25141f16d3a8e' ~ '^[0-9a-fA-F]{64}$';"
          python - <<'PY'
          import json, os
          import psycopg
          from pathlib import Path
          manifest = json.loads(Path('implementation/phase4/fixtures/real/manifest.json').read_text(encoding='utf-8'))
          with psycopg.connect(os.environ['DATABASE_URL']) as conn:
              with conn.cursor() as cur:
                  for fixture in manifest['fixtures']:
                      value = fixture['archive_sha256']
                      cur.execute("SELECT length(%s), %s ~ '^[0-9a-fA-F]{64}$'", (value, value))
                      print(fixture['archive'], repr(value), len(value), value.encode('utf-8').hex(), cur.fetchone())
          PY

      - name: Run real XML PostgreSQL smoke
        run: |
          python implementation/phase4/010_postgres_import_smoke.py \
            --result "$RUNNER_TEMP/phase4-postgres-smoke.json"
          cat "$RUNNER_TEMP/phase4-postgres-smoke.json"
